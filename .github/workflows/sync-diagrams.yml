name: Sync diagram renders

# Renders every src/**/*.drawio into a mirrored auto-images/**/*.svg and pushes
# the result back onto whichever branch triggered the run:
# - on a PR touching src/**/*.drawio, so reviewers see the rendered diagram
#   (and any render breakage) as part of the PR diff
# - on push to main, so edits committed directly to main (e.g. via the
#   app.diagrams.net GitHub integration, which saves straight to the ref it
#   opened) don't leave auto-images/ silently stale
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*.drawio'
      - '.github/workflows/sync-diagrams.yml'
  push:
    branches: [main]
    paths:
      - 'src/**/*.drawio'
      - '.github/workflows/sync-diagrams.yml'

permissions:
  contents: write

concurrency:
  group: render-${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    # Skip runs triggered by our own auto-commit push (it generates a
    # pull_request:synchronize event even though it used GITHUB_TOKEN),
    # otherwise every render commit re-triggers this workflow.
    # Default GITHUB_TOKEN also can't push to a fork's branch, so skip
    # auto-commit for PRs coming from forks too. See docs/README.md for the
    # fork fallback.
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      # scripts/render-images.sh has no change detection of its own — it
      # renders whatever file list it's given, or every src/**/*.drawio with
      # --all. As src/ accumulates versioned files that never change again,
      # re-rendering everything every run only gets more wasteful, so compute
      # the actual diff ourselves and pass just the changed files.
      - name: Compute changed diagram files
        id: changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}...HEAD"
          else
            RANGE="${{ github.event.before }} ${{ github.sha }}"
          fi

          # Restrict to src/, then filter to .drawio; exclude deletions (D) —
          # nothing to render for those, render-images.sh's orphan cleanup
          # (which always runs) handles removing their stale render instead.
          changed_files=$(git diff --name-only --diff-filter=ACMR $RANGE -- src \
            | grep '\.drawio$' || true)

          echo "Changed diagrams to render:"
          echo "$changed_files"

          {
            echo "files<<EOF"
            echo "$changed_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Pinned to the same release the repo's dev environment already uses
      # locally (v31.3.2), rather than "latest" — a past drawio-desktop
      # release introduced a CLI-flag-parsing regression, so tracking latest
      # risks silently breaking CI on an upstream release.
      - name: Install draw.io desktop CLI
        if: steps.changed.outputs.files != ''
        run: |
          set -euo pipefail
          curl -fsSL -o drawio.deb \
            https://github.com/jgraph/drawio-desktop/releases/download/v31.3.2/drawio-amd64-31.3.2.deb
          sudo apt-get update
          sudo apt-get install -y xvfb ./drawio.deb
          rm drawio.deb

      # Renders the changed files into a mirrored auto-images/ tree, stamps
      # each with its source path/commit/timestamp, and (always, even with
      # no changed files — e.g. a .drawio was deleted) removes any
      # auto-images/ renders whose source no longer exists.
      - name: Render changed diagrams and sync auto-images/
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r f; do
            [ -n "$f" ] && files+=("$f")
          done <<< "$CHANGED_FILES"
          scripts/render-images.sh "${files[@]}"

      # Regenerates unconditionally so the index always reflects the current
      # src/ and auto-images/ trees, not just what changed this run.
      - name: Regenerate diagram index
        run: scripts/generate-index.py

      - name: Commit regenerated renders and index
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync auto-images and diagram index with src diagrams"
          file_pattern: 'auto-images/** docs/diagram-index.md'
